name: Refresh roots catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['approved-roots.json', 'review-decisions.json', 'scripts/**', '.github/workflows/refresh.yml']
permissions:
  contents: write
concurrency:
  group: roots-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Validate, regenerate and publish without overwriting newer commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            # Only the disposable Actions checkout is reset. Never force-push.
            git reset --hard origin/main
            python3 -m unittest discover -s scripts -p 'test_*.py'
            python3 scripts/update.py --validate-only
            python3 scripts/update.py
            git add roots-pack.json review-queue.json status.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Refresh reviewed roots catalog and daily-word queue'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Report feed health separately from catalog publication
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          s=json.load(open('status.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"Catalog v{s['catalog_version']}; {s['root_count']} roots; {s['pending_review']} pending reviews.\n\nFeed state: {s['feed_state']}.\n")
          if s['feed_state']!='ok':
              raise SystemExit('Daily-word source is unavailable or stale. Approved catalog updates were still published; existing review items were kept.')
          PY
