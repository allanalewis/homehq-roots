name: Refresh roots catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['approved-roots.json', 'scripts/**', '.github/workflows/refresh.yml']
permissions:
  contents: write
concurrency:
  group: roots-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test catalog and publisher
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check daily words and publish reviewed content
        run: python3 scripts/update.py
      - name: Save changed catalog and review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roots-pack.json review-queue.json status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh reviewed roots catalog and daily-word queue'
            git push
          fi
